# .swiftlint.yml
# ╔══════════════════════════════════════════════╗
# ║     !! DO NOT EDIT THIS FILE MANUALLY !!     ║
# ║          SwiftLint Configuration             ║
# ║   Enforced for all targets in this project   ║
# ╚══════════════════════════════════════════════╝

# Paths to exclude
excluded:
  - Pods
  - .build
  - DerivedData
  - Generated
  - "**/*.generated.swift"
  - "**/Mocks/*.swift"
  - "**/*Test*.swift"
  - "**/*test*.swift"
  - "**/*Mock*.swift"
  - "**/*mock*.swift"
  - "**/*dummy*.swift"
  - "**/*Dummy*.swift"
  - "**/Test/**"
  - "**/test/**"
  - "**/Mock/**"
  - "**/mock/**"
  - "**/Dummy/**"
  - "**/dummy/**"
  
  
# ── Treat these as ERRORS (build fails) ──────────────────────────
analyzer_rules:
  - unused_declaration
  - unused_import

# ── Core Mandatory Rules ─────────────────────────────────────────
opt_in_rules:
  # Architecture / MVVM Enforcement
  - no_extension_access_modifier
  - file_types_order
  - type_contents_order

  # SwiftUI Anti-patterns
  - prohibited_interface_builder

  # Memory Safety
  - weak_delegate
  - class_delegate_protocol
  - discarded_notification_center_observer

  # Force & Implicit Unwrapping
  - force_unwrapping
  - force_try
  - force_cast
  - implicitly_unwrapped_optional

  # Code Quality
  - fatal_error_message
  - unowned_variable_capture
  - capture_variable
  - identical_operands
  - redundant_nil_coalescing
  - redundant_type_annotation
  - implicit_optional_initialization
  - toggle_bool
  - prefer_zero_over_explicit_init
  - empty_count
  - empty_string
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - first_where
  - last_where
  - flatmap_over_map_reduce
  - sorted_first_last
  - reduce_into
  - collection_alignment
  - array_init
  - closure_body_length
  - function_default_parameter_at_end
  - multiline_arguments
  - multiline_parameters
  - multiline_function_chains
  - explicit_init
  - explicit_self
  - modifier_order
  - convenience_type
  - static_operator
  - joined_default_parameter
  - pattern_matching_keywords
  - literal_expression_end_indentation
  - indentation_width
  - operator_usage_whitespace
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - number_separator
  - overridden_super_call
  - override_in_extension
  - prohibited_super_call
  - required_deinit
  - weak_self_guard_pattern

  # Testing
  - test_case_accessibility
  - single_test_class

  # Performance
  - prefer_infix_over_chain_filter_map
  - no_grouping_extension
  - strict_fileprivate

# ── Disabled rules ────────────────────────────────────────────
disabled_rules:
  - statement_position
  - opening_brace
  
# ── Rule Configuration ────────────────────────────────────────────
vertical_whitespace:
  max_empty_lines: 1
  severity: error
  
trailing_whitespace:
  severity: error
  
line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
  
function_body_length:
  warning: 100
  error: 200
  
function_parameter_count:
  warning: 5
  error: 8

file_length:
  warning: 2000
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 1000
  error: 2000

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 5

identifier_name:
  min_length:
    error: 2
  max_length:
    error: 50
  allowed_symbols: ["_"]
  validates_start_with_lowercase: false
  excluded:
    - id
    - x
    - y
    - i

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: error

implicitly_unwrapped_optional:
  mode: all_except_iboutlets
  severity: error

trailing_closure:
  only_single_muted_parameter: true

closure_body_length:
  warning: 1000
  error: 1100

unowned_variable_capture:
  severity: error

required_deinit:
  severity: error
  
weak_self_guard_pattern:
  severity: error

# ── Custom Rules (MVVM + SwiftUI Enforcement) ─────────────────────
# These rules enforce architectural standards specific to this project.
# DO NOT REMOVE these rules.

custom_rules:

  # ❌ No @State in Views — all state must live in ViewModel
  no_state_in_view:
    name: "No @State in View"
    regex: '(@State\s+(private\s+)?var)'
    message: >
      ❌ MVVM Violation: Do not use @State in Views.
      Move all state to a ViewModel using @Published + @StateObject or @ObservedObject.
      Views should be stateless and only render what the ViewModel exposes.
    severity: error

  # ❌ No business/presentation logic in View body
  no_logic_in_view_body:
    name: "No Logic in View Body"
    regex: >-
        (guard\s+let|
        \.filter\s*\{|
        \.map\s*\{|
        \.forEach\s*\{|
        while\s+\w+|
        for\s+\w+\s+in|
        try[?!]?|
        \.sorted\s*\{|
        \.compactMap\s*\{)
    included: ".*View\\.swift"
    match_kinds:
    - keyword
    - identifier
    message: >
        ❌ MVVM Violation: Do not place business logic inside a SwiftUI View.
        Move filtering, mapping, loops, optionals, sorting to ViewModel/UseCase.
    severity: error
    
    # ❌ No heavy business logic in SwiftUI View
    no_heavy_logic_in_view_body:
      name: "No Heavy Logic in View Body"
      included: ".*View\\.swift"
      regex: >
        (
          for\s+\w+\s+in\s+ |
          while\s*\( |
          repeat\s*\{ |
          do\s*\{ |
          catch\s*\{ |
          guard\s+let\s+ |
          guard\s+var\s+
        )
      message: >
        ❌ MVVM Violation: Heavy business logic detected in SwiftUI View.
        Loops, complex conditionals, error handling, and inline computations
        should live in the ViewModel or a UseCase layer.
        Views must only render state and forward user actions.
      severity: error

  # ❌ No direct URLSession or network calls from View
  no_network_in_view:
    name: "No Networking in View"
    regex: '(URLSession\.|AF\.|Alamofire\.)'
    included: ".*View\\.swift"
    message: >
      ❌ Architecture Violation: Do not make network calls from a View.
      Networking belongs in a Repository, Service, or UseCase layer.
    severity: error

  # ⚠️ No TODO/FIXME in production code
  no_todos_in_production:
    name: "No TODO/FIXME in Production"
    regex: '(TODO|FIXME|HACK|XXX):'
    excluded:
      - ".*Tests\\.swift"
      - ".*Mock\\.swift"
    message: >
      ⚠️ Remove TODO/FIXME before merging to main.
      Create a tracked ticket instead of leaving inline reminders.
    severity: warning

  # ⚠️ Detect strong self capture in closures
  no_strong_self_in_closure:
    name: "Avoid Strong Self Capture in Closures"
    regex: '\{\s*\[self\]'
    message: >
      ⚠️ Memory Leak Risk: Avoid capturing [self] strongly in closures.
      Use [weak self] or [unowned self] (prefer weak) to prevent retain cycles.
    severity: warning

  # ❌ No print() in production code
  no_print_in_production:
    name: "No print() in Production"
    regex: '\bprint\s*\('
    excluded:
      - ".*Tests\\.swift"
      - ".*Debug\\.swift"
      - ".*Logger\\.swift"
    message: >
      ❌ Do not use print() in production code.
      Use a Logger (os.Logger, OSLog, or a custom logging abstraction) instead.
    severity: error

  # ❌ No force downcast
  no_force_downcast:
    name: "No Force Downcast"
    regex: 'as!\s+\w+'
    message: >
      ❌ Avoid force downcasting with `as!`.
      Use `as?` with optional binding (if let / guard let) instead.
    severity: error

